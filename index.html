<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 Login - Bizzybee</title>

    <link rel="stylesheet" href="./src/core/global.css">
    <link rel="stylesheet" href="./src/core/hive-mind/hive-mind.css">
    <link rel="stylesheet" href="./src/core/hive-mind/nano-bee.css">
    <link rel="stylesheet" href="./login.css">
    <link rel="manifest" href="./manifest.json">
</head>
<body class="login-body">

    <main class="login-container">
        <div class="hive-core-bg"></div>

        <div class="login-card">
            <h1 class="gold-gradient-text">Bizzybee Login</h1>
            <p class="subtitle">Authenticate to access the Hive.</p>

            <form id="login-form" class="auth-form">
                <div class="input-group-auth">
                    <label for="email">Email</label>
                    <input type="email" id="email" required>
                </div>

                <div class="input-group-auth">
                    <label for="password">Passcode</label>
                    <input type="password" id="password" required>
                </div>

                <p id="login-error" class="login-error" hidden></p>

                <button type="submit" id="auth-submit-btn">Enter Hive</button>
            </form>

            <div id="load-save-section" class="load-save-section" hidden>
                <p class="load-save-heading">🐝 Welcome back. This device doesn't have your data yet.</p>
                <p class="load-save-copy">Import your exported save file to continue (Settings &rarr; Full Save Transfer on your other device).</p>
                <input type="file" id="load-save-input" accept="application/json" class="load-save-input">
                <button type="button" id="load-save-btn">📥 Load My Save</button>
                <p id="load-save-status" class="load-save-status" hidden></p>
            </div>

            <div class="auth-footer">
                <p>New Worker Bee?</p>
                <a href="#" class="btn-link">Request Access</a>
            </div>
        </div>
    </main>

    <script src="./src/core/db.js"></script>
    <script src="./src/core/plugins.js"></script>
    <script src="./src/core/app.js"></script>
    <script src="./src/core/hive-mind/nano-bee.js"></script>
    <script src="./src/core/hive-mind/hive-mind.js"></script>

    <script src="./login.js"></script>
</body>
</html>
