<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Reset Password · Bizzybee</title>
    <link rel="stylesheet" href="./src/core/global.css">
    <link rel="stylesheet" href="./login.css">
    <style>[hidden] { display: none !important; } .login-card { max-width: 460px; } #recovery-status { line-height: 1.6; }</style>
</head>
<body class="login-body">
<main class="login-container"><div class="login-card">
    <h1 class="gold-gradient-text">Reset Password</h1>
    <p class="subtitle">Your Bizzybee cloud account</p>
    <form id="request-reset-form" class="auth-form">
        <div class="input-group-auth"><label for="recovery-email">Account email</label><input id="recovery-email" type="email" autocomplete="email" required></div>
        <button type="submit">Email Reset Link</button>
    </form>
    <form id="new-password-form" class="auth-form" hidden>
        <div class="input-group-auth"><label for="new-password">New password</label><input id="new-password" type="password" autocomplete="new-password" minlength="12" required></div>
        <div class="input-group-auth"><label for="confirm-password">Confirm password</label><input id="confirm-password" type="password" autocomplete="new-password" minlength="12" required></div>
        <p>Use at least 12 characters. Your cloud saves and backups remain available after the change.</p>
        <button type="submit">Set New Password</button>
    </form>
    <p id="recovery-status" role="status" aria-live="polite"></p>
    <a class="btn-link" href="./index.html">Back to Login</a>
</div></main>
<script src="./src/core/account-recovery.js"></script>
<script src="./reset-password.js"></script>
</body>
</html>
