# Netlify config for the Cloud Sync feature (Netlify Functions + Netlify
# Blobs) - everything else about this site (a plain static HTML/CSS/JS app,
# no build step) still needs nothing else here. Functions live under
# netlify/functions/ - this is what tells Netlify to actually look there,
# since there's no build plugin/framework that would otherwise auto-detect
# it on a site with no build command configured.
[functions]
  directory = "netlify/functions"

# Habits and To-Dos became core features on 2026-10-09 and moved from
# src/plugins/ to src/features/. Old bookmarks still land on the new pages.
[[redirects]]
  from = "/src/plugins/habits/*"
  to = "/src/features/habits/:splat"
  status = 301

[[redirects]]
  from = "/src/plugins/todos/*"
  to = "/src/features/todos/:splat"
  status = 301

# The Egg Incubator stopped being a plugin on 2026-10-29 (bought in the Honey Store).
[[redirects]]
  from = "/src/plugins/incubator/*"
  to = "/src/features/incubator/:splat"
  status = 301

# Dictionary became a plugin on 2026-10-11 (src/features/ -> src/plugins/).
[[redirects]]
  from = "/src/features/dictionary/*"
  to = "/src/plugins/dictionary/:splat"
  status = 301

# Oct 2026 cleanup: the login helper pages moved out of the project root.
[[redirects]]
  from = "/reset-password.html"
  to = "/src/core/login/reset-password.html"
  status = 301

[[redirects]]
  from = "/request-access.html"
  to = "/src/features/request-access/request-access.html"
  status = 301

[[redirects]]
  from = "/suggestions.html"
  to = "/src/features/suggestions/suggestions.html"
  status = 301
