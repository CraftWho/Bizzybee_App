# Netlify config for the Cloud Sync feature (Netlify Functions + Netlify
# Blobs) - everything else about this site (a plain static HTML/CSS/JS app,
# no build step) still needs nothing else here. Functions live under
# netlify/functions/ - this is what tells Netlify to actually look there,
# since there's no build plugin/framework that would otherwise auto-detect
# it on a site with no build command configured.
[functions]
  directory = "netlify/functions"

# Oct 31 2026 (Craft): a tiny build step. It only writes version.json (this
# deploy's id), which the service worker (sw.js) uses to know when to swap
# its cached copy of the app for the new one. Publishes the repo root, as before.
[build]
  command = "node tools/stamp-version.mjs"
  publish = "."
  ignore = "exit 0"   # deck-appimage branch: never deploy

# Oct 31 2026 (Craft): caching.
# Images, icons, fonts, 3D: phones keep them 7 days (give new art a NEW file
# name, or phones keep the old one up to a week). Code and pages stay
# "always check" here; sw.js caches them per deploy instead.
[[headers]]
  for = "/src/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-store"
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Oct 31 2026 (Craft): not part of the app, so not public. These addresses
# show "not found" (functions still work: they live under /.netlify/).
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/node_modules/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

# Habits and To-Dos became core features on 2026-10-09 and moved from
# src/plugins/ to src/features/. Old bookmarks still land on the new pages.
[[redirects]]
  from = "/src/plugins/habits/*"
  to = "/src/features/habits/:splat"
  status = 301

[[redirects]]
  from = "/src/plugins/todos/*"
  to = "/src/features/todos/:splat"
  status = 301

# Dictionary became a plugin on 2026-10-11 (src/features/ -> src/plugins/).
[[redirects]]
  from = "/src/features/dictionary/*"
  to = "/src/plugins/dictionary/:splat"
  status = 301

# Oct 31 2026 (Craft): Colony was renamed Hive Mind (pages and folders).
# Code links were all updated; these catch old bookmarks, home-screen links
# and phone alarms scheduled before the rename. The ?query is kept.
[[redirects]]
  from = "/src/features/colony/colony.html"
  to = "/src/features/hive-mind/hive-mind.html"
  status = 301
[[redirects]]
  from = "/src/features/colony/hive-visit.html"
  to = "/src/features/hive-mind/hive-visit.html"
  status = 301
[[redirects]]
  from = "/src/features/colony-bees/colony-bees.html"
  to = "/src/features/hive-bees/hive-bees.html"
  status = 301

# Oct 2026 cleanup: the login helper pages moved out of the project root.
[[redirects]]
  from = "/reset-password.html"
  to = "/src/core/login/reset-password.html"
  status = 301

[[redirects]]
  from = "/request-access.html"
  to = "/src/features/request-access/request-access.html"
  status = 301

[[redirects]]
  from = "/suggestions.html"
  to = "/src/features/suggestions/suggestions.html"
