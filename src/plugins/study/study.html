<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../../../favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="../../../src/assets/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../../../src/assets/icons/favicon-16x16.png">
    <link rel="apple-touch-icon" href="../../../src/assets/icons/apple-touch-icon.png">
    <link rel="manifest" href="../../../manifest.json">
    <meta name="theme-color" content="#050402">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>🎓 Study</title>

    <script src="../../core/boot.js" data-load="styles"></script>
    <link rel="stylesheet" href="../../core/ui/status-dot/status-dot.css">
    <link rel="stylesheet" href="../../core/ui/page-v2/page-v2.css">
    <link rel="stylesheet" href="./study.css">
</head>
<body>

    <!-- Study v2 (Oct 2026): same look as Settings. Ids unchanged. -->
    <main class="pv2 sd2">
        <header class="pv2-head">
            <h1 class="pv2-title">🎓 STUDY</h1>
            <p class="pv2-lead">Courses, topics and things to learn that aren't a Quest or a Daily.</p>
        </header>

        <section id="study-not-installed" class="card" hidden>
            <a class="row" href="../../features/plugin-hub/plugin-hub.html"><span class="hx">🧩</span><span class="mid"><b>Study isn't installed</b><small>Turn it on in Plugins &amp; Packs</small></span><span class="chev">›</span></a>
        </section>

        <div id="study-app" hidden>
            <div class="chips sd-tabs" role="tablist" aria-label="Study sections">
                <button type="button" class="chip" role="tab" data-tab="focus" aria-pressed="true">Focus</button>
                <button type="button" class="chip" role="tab" data-tab="topics" aria-pressed="false">Topics</button>
                <button type="button" class="chip" role="tab" data-tab="tips" aria-pressed="false">Tips</button>
            </div>

            <section id="sd-focus">
                <div class="card sd-stage" id="sd-stage">
                    <div class="sd-subject"><div><small>Studying</small><b id="sd-subj">Anything</b></div><button type="button" class="chip" id="sd-subj-btn">Change</button></div>
                    <div class="sd-phase" id="sd-phase">Focus 1 of 4</div>
                    <div class="sd-glass" id="sd-glass"></div>
                    <div class="sd-time" id="sd-time">25:00</div>
                    <div class="sd-dots" id="sd-dots"></div>
                    <div class="sd-ctl"><button type="button" class="btn solid" id="sd-go">START</button><button type="button" class="btn" id="sd-reset">RESET</button></div>
                </div>
                <div class="card sd-break" id="sd-break" hidden>
                    <div class="sd-nudge"><span id="sd-nudge-ic" aria-hidden="true">💧</span><div><b id="sd-nudge-t"></b><p id="sd-nudge-p"></p></div></div>
                    <small class="sd-lbl">How is your energy?</small>
                    <div class="chips" id="sd-energy"><button type="button" class="chip" aria-pressed="false" data-e="low">Low</button><button type="button" class="chip" aria-pressed="false" data-e="ok">Okay</button><button type="button" class="chip" aria-pressed="false" data-e="high">Sharp</button></div>
                    <p class="sd-say" id="sd-say"></p>
                    <button type="button" class="btn" id="sd-nudge-next">ANOTHER IDEA</button>
                </div>
                <h2 class="sec">Session</h2>
                <div class="card sd-set">
                    <div class="chips" id="sd-lens"><button type="button" class="chip" aria-pressed="true" data-f="25" data-b="5">25 / 5</button><button type="button" class="chip" aria-pressed="false" data-f="50" data-b="10">50 / 10</button><button type="button" class="chip" aria-pressed="false" data-f="15" data-b="3">15 / 3</button></div>
                    <div class="chips" id="sd-styles"><button type="button" class="chip" aria-pressed="true" data-s="glass">Hourglass</button><button type="button" class="chip" aria-pressed="false" data-s="ring">Ring</button></div>
                </div>
                <div class="stats"><div><b id="sd-s-today">0 min</b><small>Focus today</small></div><div><b id="sd-s-week">0 min</b><small>This week</small></div><div><b id="sd-s-fill">0</b><small>To fill in</small></div></div>
                <div id="sd-fill-list"></div>
            </section>

            <section id="sd-tips" hidden></section>

            <section id="sd-topics" hidden>
            <details class="card sd-add">
                <summary class="row"><span class="hx">➕</span><span class="mid"><b>Add a topic</b><small>Video, article, course, book…</small></span><span class="chev">›</span></summary>
                <div class="sd-form">
                    <label class="lbl" for="study-topic-input">Topic</label>
                    <input type="text" id="study-topic-input" class="sd-in" placeholder="e.g. CSS Grid vs Flexbox">
                    <div class="sd-two">
                        <div><label class="lbl" for="study-type-select">Type</label>
                            <select id="study-type-select" class="sd-in"><option>Video</option><option>Article</option><option>Course</option><option>Book</option><option>Documentation</option><option>Other</option></select></div>
                        <div><label class="lbl" for="study-priority-select">Priority</label>
                            <select id="study-priority-select" class="sd-in"><option>High</option><option selected>Medium</option><option>Low</option></select></div>
                    </div>
                    <label class="lbl" for="study-link-input">Link (optional)</label>
                    <input type="text" id="study-link-input" class="sd-in" placeholder="https://...">
                    <div class="btns"><button type="button" id="study-add-btn" class="btn solid">Add to queue</button></div>
                </div>
            </details>
            <div id="study-list"></div>
            </section>
        </div>

        <div class="sd-scrim" id="sd-scrim" hidden><div class="card sd-sheet" id="sd-sheet"></div></div>
    </main>

    <script src="../../core/boot.js"></script>
    <script src="../../core/ui/status-dot/status-dot.js"></script>

    <script src="../../core/ui/page-v2/page-v2.js"></script>
    <script src="./study.js"></script>
    <script src="./study-focus.js"></script>
</body>
</html>
