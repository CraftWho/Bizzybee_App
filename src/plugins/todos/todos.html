<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../../../favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="../../../src/assets/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../../../src/assets/icons/favicon-16x16.png">
    <link rel="apple-touch-icon" href="../../../src/assets/icons/apple-touch-icon.png">
    <link rel="manifest" href="../../../manifest.json">
    <meta name="theme-color" content="#050402">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>📝 To-Dos</title>

    <link rel="stylesheet" href="../../core/global.css">
    <link rel="stylesheet" href="../../core/hive-mind/hive-mind.css">
    <link rel="stylesheet" href="../../core/hive-mind/nano-bee.css">
    <link rel="stylesheet" href="../../core/toast/toast.css">
    <link rel="stylesheet" href="../../features/llm-engine/llm-engine.css">
    <link rel="stylesheet" href="../../core/habit-row/habit-row.css">
    <link rel="stylesheet" href="../../core/task-row/task-row.css">
    <link rel="stylesheet" href="./todos.css">
</head>
<body>

    <main class="todos-container">
        <section class="dl-head">
            <h2 class="dl-title">📝 TO-DOS <small id="td-hold">Hold a to-do to move it</small></h2>
            <p class="td-sum" id="td-sum"></p>
            <div class="td-tabs" role="tablist" aria-label="Show">
                <button type="button" role="tab" data-tab="active" aria-selected="true">Active <b id="td-n-active">0</b></button>
                <button type="button" role="tab" data-tab="scheduled" aria-selected="false">Scheduled <b id="td-n-scheduled">0</b></button>
                <button type="button" role="tab" data-tab="done" aria-selected="false">Done <b id="td-n-done">0</b></button>
            </div>
            <p class="dl-tip" id="td-tip">Tap the hexagon when it's done. Tap a to-do to edit it.</p>
        </section>

        <div id="todos-not-installed" class="panel todos-not-installed" hidden>
            <p>This plugin isn't installed yet.</p>
            <a href="../plugin-hub/plugin-hub.html" class="todos-install-link">🧩 Go to Plugin Hub →</a>
        </div>

        <section id="todos-app" hidden>
            <div id="todo-task-list"></div>
        </section>
    </main>

    <script src="../../core/db.js"></script>
    <script src="../../core/plugins.js"></script>
    <script src="../../core/app.js"></script>
    <script src="../../core/hive-mind/nano-bee.js"></script>
    <script src="../../core/hive-mind/hive-mind.js"></script>
    <script src="../../core/toast/toast.js"></script>
    <script src="../../core/reminders/reminders.js"></script>
    <script src="../../features/llm-engine/llm-engine.js"></script>

    <script src="../../core/habit-row/habit-row.js"></script>
    <script src="../../core/task-row/task-row.js"></script>
    <script src="./todos.js"></script>
</body>
</html>
