<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../../../favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="../../../src/assets/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../../../src/assets/icons/favicon-16x16.png">
    <link rel="apple-touch-icon" href="../../../src/assets/icons/apple-touch-icon.png">
    <link rel="manifest" href="../../../manifest.json">
    <meta name="theme-color" content="#050402">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>📖 Dictionary</title>

    <script src="../../core/boot.js" data-load="styles"></script>
    <link rel="stylesheet" href="./dictionary.css">
</head>
<body>

    <main class="dcv2" id="dc-main">
        <section class="card top">
            <div class="head"><h1>📖 DICTIONARY</h1><div class="meta"><b id="dc-count"></b>terms</div></div>
            <p class="sub">Your own glossary. Each term's category is a skill: any task that mentions the term counts toward it. Tip: add a new tag next to a skill tag and it lands here.</p>
            <label class="search">🔍<input id="dc-q" type="search" placeholder="Search terms" aria-label="Search terms"></label>
            <div class="chips" id="dc-chips"></div>
            <button type="button" class="new" id="dc-new">＋ New term</button>
        </section>
        <div id="dc-list"></div>
    </main>

    <div id="dictionary-not-installed" class="panel dictionary-not-installed" hidden>
        <p>The Dictionary plugin isn't installed.</p>
        <a href="../../features/plugin-hub/plugin-hub.html" class="dictionary-install-link">🧩 Go to Plugin Hub →</a>
    </div>

    <div class="dc-sheet-bg" id="dc-sheet" hidden><div class="sheet" id="dc-sheet-body" role="dialog" aria-modal="true"></div></div>

    <script src="../../core/boot.js"></script>

    <script src="./dictionary.js"></script>
</body>
</html>
