<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../../../favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="../../../src/assets/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../../../src/assets/icons/favicon-16x16.png">
    <link rel="apple-touch-icon" href="../../../src/assets/icons/apple-touch-icon.png">
    <link rel="manifest" href="../../../manifest.json">
    <meta name="theme-color" content="#050402">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>💻 Terminal</title>
    <script src="../../core/boot.js" data-load="styles"></script>
    <link rel="stylesheet" href="../../core/ui/page-v2/page-v2.css">
    <link rel="stylesheet" href="./terminal.css">
</head>
<body>
    <main class="tmv2">
        <header class="pv2-head">
            <h1 class="pv2-title">💻 TERMINAL</h1>
            <p class="pv2-lead">Support console. Type commands to repair your save or check your access.</p>
        </header>
        <div id="terminal-not-installed" class="tm-card" hidden>
            <p>The Terminal plugin isn't downloaded on this device.</p>
            <a href="../../features/plugin-hub/plugin-hub.html#terminal" class="tm-btn">🧩 Get it in Plugins &amp; Packs →</a>
        </div>
        <section id="terminal-app" class="tm-screen" hidden>
            <div class="tm-bar"><span class="tm-dots" aria-hidden="true"><i></i><i></i><i></i></span><b>BIZZYBEE TERMINAL</b><span id="tm-mode" class="tm-mode"></span></div>
            <div class="tm-out" id="tm-out" role="log" aria-live="polite" aria-label="Terminal output" tabindex="0"></div>
            <form class="tm-in" id="tm-form" autocomplete="off">
                <label for="tm-input" class="tm-prompt">&gt;</label>
                <input id="tm-input" type="text" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="send" placeholder="type a command" aria-label="Command">
                <button type="submit" class="tm-run" aria-label="Run">⏎</button>
            </form>
        </section>
        <div class="tm-chips" id="tm-chips" aria-label="Quick commands" hidden></div>
    </main>

    <script src="../../core/boot.js"></script>
    <script src="./terminal.js"></script>
</body>
</html>
