<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../../../favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="../../../src/assets/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../../../src/assets/icons/favicon-16x16.png">
    <link rel="apple-touch-icon" href="../../../src/assets/icons/apple-touch-icon.png">
    <link rel="manifest" href="../../../manifest.json">
    <meta name="theme-color" content="#050402">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>📅 Calendar</title>

    <script src="../../core/boot.js" data-load="styles"></script>
    <link rel="stylesheet" href="../../core/ui/modal/modal.css">
    <link rel="stylesheet" href="./calendar.css">
</head>
<body>

    <main class="calv2">

        <section class="card top cal-title">
            <h1>📅 CALENDAR</h1>
            <button id="calendar-add-event-btn" class="btn solid" type="button">+ Event</button>
        </section>

        <div id="calendar-not-installed" class="card" hidden>
            <p class="sub">The Calendar plugin isn't downloaded on this device.</p>
            <a href="../../features/plugin-hub/plugin-hub.html#calendar" class="btn solid">🧩 Get it in Plugins &amp; Packs →</a>
        </div>

        <div id="calendar-app" hidden>
            <section class="card">
                <div class="cal-head">
                    <button id="calendar-prev-btn" class="nav" type="button" aria-label="Previous">‹</button>
                    <h3 id="calendar-period-label" aria-live="polite"></h3>
                    <button id="calendar-next-btn" class="nav" type="button" aria-label="Next">›</button>
                    <button id="calendar-today-btn" class="btn" type="button">Today</button>
                </div>
                <div class="seg" id="calendar-view-toggle" role="group" aria-label="View">
                    <button class="calendar-view-btn" type="button" data-view="month">Month</button>
                    <button class="calendar-view-btn" type="button" data-view="week">Week</button>
                    <button class="calendar-view-btn" type="button" data-view="day">Day</button>
                </div>
                <div id="calendar-board" class="calendar-board"></div>
                <div class="legend" aria-hidden="true"><span style="--c:#ffcc00">Quest</span><span style="--c:#5aa9ff">Daily</span><span style="--c:#5fd38a">To-Do</span><span style="--c:#dc143c">Event</span></div>
            </section>
            <div id="calendar-agenda-wrap">
                <h2 class="sec" id="calendar-agenda-title"></h2>
                <section class="card" id="calendar-agenda"></section>
            </div>
            <p class="cal-sync"><a href="../../features/sync/sync.html">🔄 Show this on your phone →</a></p>
        </div>

    </main>

    <script src="../../core/boot.js"></script>

    <script src="./calendar.js"></script>
</body>
</html>
