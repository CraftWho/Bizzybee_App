<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../../../favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="../../../src/assets/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../../../src/assets/icons/favicon-16x16.png">
    <link rel="apple-touch-icon" href="../../../src/assets/icons/apple-touch-icon.png">
    <link rel="manifest" href="../../../manifest.json">
    <meta name="theme-color" content="#050402">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>📅 Calendar</title>

    <link rel="stylesheet" href="../../core/global.css">
    <link rel="stylesheet" href="../../core/hive-mind/hive-mind.css">
    <link rel="stylesheet" href="../../core/hive-mind/nano-bee.css">
    <link rel="stylesheet" href="../../core/modal/modal.css">
    <link rel="stylesheet" href="../../core/toast/toast.css">
    <link rel="stylesheet" href="../../features/llm-engine/llm-engine.css">
    <link rel="stylesheet" href="./calendar.css">
</head>
<body>

    <main class="calendar-container">

        <div class="panel page-header-panel">
            <h2 class="page-title">📅 <span class="gold-gradient-text">CALENDAR</span></h2>
            <p class="page-subtitle">Your quests and dailies, plotted on a real calendar - plus anything you want to add yourself.</p>
        </div>

        <div id="calendar-not-installed" class="panel calendar-not-installed" hidden>
            <p>This plugin isn't installed yet.</p>
            <a href="../plugin-hub/plugin-hub.html" class="calendar-install-link">🧩 Go to Plugin Hub →</a>
        </div>

        <div id="calendar-app" class="calendar-app" hidden>

            <section class="panel calendar-toolbar">
                <div class="calendar-nav">
                    <button id="calendar-prev-btn" class="calendar-nav-btn">←</button>
                    <span id="calendar-period-label" class="calendar-period-label"></span>
                    <button id="calendar-next-btn" class="calendar-nav-btn">→</button>
                    <button id="calendar-today-btn" class="calendar-today-btn">Today</button>
                </div>
                <div class="calendar-view-toggle" id="calendar-view-toggle">
                    <button class="calendar-view-btn" data-view="month">Month</button>
                    <button class="calendar-view-btn" data-view="week">Week</button>
                    <button class="calendar-view-btn" data-view="day">Day</button>
                </div>
                <button id="calendar-add-event-btn" class="calendar-add-btn">➕ Add Event</button>
            </section>

            <section class="panel calendar-board-panel">
                <div id="calendar-board" class="calendar-board"></div>
            </section>

            <div class="calendar-legend">
                <span class="calendar-legend-item"><span class="calendar-dot calendar-dot--quest"></span> Quest task</span>
                <span class="calendar-legend-item"><span class="calendar-dot calendar-dot--daily"></span> Daily</span>
                <span class="calendar-legend-item"><span class="calendar-dot calendar-dot--event"></span> Your event</span>
            </div>

        </div>

    </main>

    <script src="../../core/db.js"></script>
    <script src="../../core/plugins.js"></script>
    <script src="../../core/app.js"></script>
    <script src="../../core/hive-mind/nano-bee.js"></script>
    <script src="../../core/hive-mind/hive-mind.js"></script>
    <script src="../../core/toast/toast.js"></script>
    <script src="../../core/reminders/reminders.js"></script>
    <script src="../../features/llm-engine/llm-engine.js"></script>

    <script src="./calendar.js"></script>
</body>
</html>
