<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../../../favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="../../../src/assets/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../../../src/assets/icons/favicon-16x16.png">
    <link rel="apple-touch-icon" href="../../../src/assets/icons/apple-touch-icon.png">
    <link rel="manifest" href="../../../manifest.json">
    <meta name="theme-color" content="#ffd700">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>🗺️ Map</title>

    <link rel="stylesheet" href="../../core/global.css">
    <link rel="stylesheet" href="../../core/hive-mind/hive-mind.css">
    <link rel="stylesheet" href="../../core/hive-mind/nano-bee.css">
    <link rel="stylesheet" href="../../core/modal/modal.css">
    <link rel="stylesheet" href="../../core/toast/toast.css">
    <link rel="stylesheet" href="../llm-engine/llm-engine.css">
    <link rel="stylesheet" href="./map.css">
</head>
<body>

    <main class="map-container">
        <div class="panel page-header-panel">
            <h2 class="page-title">🗺️ <span class="gold-gradient-text">YOUR ROADMAP</span></h2>
            <p class="page-subtitle">From your first step to the finish line — every stop is a real campaign.</p>
        </div>

        <div class="map-frame" id="map-frame">
            <!-- The actual picture - a real, standalone SVG asset file (see
                 ./assets/map-background.svg), linked in via <object> rather
                 than <img> so map.js can still reach inside it and read the
                 baked-in road path's geometry once it loads. -->
            <object id="map-picture" class="map-picture" type="image/svg+xml" data="./assets/map-background.svg" aria-label="Illustrated roadmap background"></object>

            <div class="map-markers" id="map-markers"></div>

            <!-- Bottom-right corner controls: the key toggle sits above the
                 compass, both fixed to the frame rather than the road's own
                 coordinate system. -->
            <div class="map-corner-controls">
                <button class="map-key-btn" id="map-key-btn" title="Show map key" aria-label="Show map key">🗝️</button>
                <div class="map-compass" aria-hidden="true" title="Compass">🧭</div>
            </div>
        </div>

        <div class="map-footer-link">
            <a href="../quests/quests.html">View full Quest Log →</a>
        </div>
    </main>

    <script src="../../core/db.js"></script>
    <script src="../../core/plugins.js"></script>
    <script src="../../core/app.js"></script>
    <script src="../../core/hive-mind/nano-bee.js"></script>
    <script src="../../core/hive-mind/hive-mind.js"></script>
    <script src="../../core/toast/toast.js"></script>
    <script src="../../core/reminders/reminders.js"></script>
    <script src="../llm-engine/llm-engine.js"></script>

    <script src="./map.js"></script>
</body>
</html>
