<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../../../favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="../../assets/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../../assets/icons/favicon-16x16.png">
    <link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png">
    <title>🐝 Request Access - Bizzybee</title>

    <link rel="stylesheet" href="../../core/global.css">
    <link rel="stylesheet" href="../../core/ui/hive-mind/nano-bee.css">
    <link rel="stylesheet" href="../../core/login/login.css">
    <link rel="stylesheet" href="./request-access.css">
    <link rel="manifest" href="../../../manifest.json">
    <meta name="theme-color" content="#050402">
    <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body class="login-body">

    <main class="login-container">
        <div class="hive-core-bg"></div>

        <div class="login-card">
            <h1 class="gold-gradient-text">Request Access</h1>
            <p class="subtitle">No account yet? Tell us who you are and we'll send you an invite.</p>

            <!-- A real, plain static Netlify Form - detected and handled
                 entirely by Netlify at deploy time, no backend code
                 anywhere in this app. Submissions land in the site's
                 Netlify dashboard under Forms; an email notification to
                 Leo is wired up separately there (Site configuration ->
                 Forms -> Form notifications), not in this code. See
                 HANDOFF.md's "Request Access" entry for why this couldn't
                 be built on Netlify Identity instead - Identity invites
                 are admin-only, there's no built-in "ask for one" flow on
                 that side. netlify-honeypot + the off-screen "bot-field"
                 input below is Netlify's own documented spam-filter
                 pattern - real visitors never see or fill it, simple bots
                 that blindly fill every input often do. -->
            <form id="request-access-form" class="auth-form" name="request-access" method="POST" data-netlify="true" netlify-honeypot="bot-field">
                <input type="hidden" name="form-name" value="request-access">
                <p class="request-access-honeypot" aria-hidden="true">
                    <label>Don't fill this out if you're human: <input name="bot-field" type="text" tabindex="-1" autocomplete="off"></label>
                </p>

                <div class="input-group-auth">
                    <label for="request-name">Name</label>
                    <input type="text" id="request-name" name="name" autocomplete="name" required>
                </div>

                <div class="input-group-auth">
                    <label for="request-email">Email</label>
                    <input type="email" id="request-email" name="email" autocomplete="email" required>
                </div>

                <div class="input-group-auth">
                    <label for="request-reason">Why do you want access?</label>
                    <textarea id="request-reason" name="reason" rows="4" required></textarea>
                </div>

                <p id="request-access-error" class="login-error" hidden></p>

                <button type="submit" id="request-access-submit-btn">Send Request</button>
            </form>

            <!-- Shown in place of the form once the AJAX submit below
                 succeeds - see request-access.js. Keeps the whole flow on
                 this one page rather than redirecting to a separate
                 Netlify-hosted "Thank you" page. -->
            <div id="request-access-sent" class="request-access-sent" hidden>
                <p class="request-access-sent-icon">✅</p>
                <p class="request-access-sent-text">Thanks! Your request is in - we'll email you an invite if you're approved.</p>
            </div>

            <div class="auth-footer">
                <a href="../../../index.html" class="btn-link">← Back to Login</a>
            </div>
        </div>
    </main>

    <script src="../../core/ui/hive-mind/nano-bee.js"></script>
    <script src="./request-access.js"></script>
</body>
</html>
