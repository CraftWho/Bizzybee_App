<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../../../favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="../../../src/assets/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../../../src/assets/icons/favicon-16x16.png">
    <link rel="apple-touch-icon" href="../../../src/assets/icons/apple-touch-icon.png">
    <link rel="manifest" href="../../../manifest.json">
    <meta name="theme-color" content="#050402">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>🧩 Plugins &amp; Packs</title>

    <script src="../../core/boot.js" data-load="styles"></script>
    <link rel="stylesheet" href="../../core/ui/modal/modal.css">
    <link rel="stylesheet" href="./plugin-hub.css">
</head>
<body>

    <main class="phv2">
        <section class="card top">
            <h1>🧩 PLUGINS &amp; PACKS</h1>
            <p class="sub">The base app stays small. Download only what you use, like extra packs in a game. Switch on = download. Switch off = delete from this device. Your progress is never deleted.</p>
        </section>
        <section class="card">
            <div class="store"><span>On this device</span><b id="ph-used">…</b></div>
            <div class="bar"><i id="ph-usedbar"></i></div>
            <p class="sub" id="ph-usedsub"></p>
        </section>
        <h2 class="sec">Plugins</h2>
        <section class="card" id="ph-plugins"></section>
        <h2 class="sec">Quality packs</h2>
        <section class="card" id="ph-packs"></section>
        <h2 class="sec">Coming soon</h2>
        <section class="card" id="ph-soon"></section>
    </main>
    <div class="ph-modal" id="ph-modal" hidden></div>

    <script src="../../core/boot.js" data-with="services/packs/packs.js"></script>

    <script src="./plugin-hub.js"></script>
</body>
</html>
