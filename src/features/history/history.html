<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../../../favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="../../../src/assets/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../../../src/assets/icons/favicon-16x16.png">
    <link rel="apple-touch-icon" href="../../../src/assets/icons/apple-touch-icon.png">
    <link rel="manifest" href="../../../manifest.json">
    <meta name="theme-color" content="#050402">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>🕘 History</title>

    <script src="../../core/boot.js" data-load="styles"></script>
    <link rel="stylesheet" href="../../core/ui/modal/modal.css">
    <link rel="stylesheet" href="../../core/ui/page-v2/page-v2.css">
    <link rel="stylesheet" href="./history.css">
</head>
<body>

    <!-- History (Oct 29 2026): everything you finished, one day at a time. -->
    <main class="pv2 hi2">
        <header class="pv2-head">
            <h1 class="pv2-title">🕘 HISTORY</h1>
            <p class="pv2-lead">Everything you finished, day by day. Tap one to open it.</p>
        </header>
        <section class="card hi-day">
            <button type="button" class="hi-nav" id="hi-prev" aria-label="Day before">‹</button>
            <div class="hi-mid"><b id="hi-date"></b><small id="hi-total"></small></div>
            <button type="button" class="hi-nav" id="hi-next" aria-label="Day after">›</button>
        </section>
        <section class="card"><ul class="hi-list" id="hi-list"></ul></section>
    </main>

    <script src="../../core/boot.js"></script>

    <script src="../../core/ui/page-v2/page-v2.js"></script>
    <script src="./history.js"></script>
</body>
</html>
