<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../../../favicon.ico">
    <link rel="manifest" href="../../../manifest.json">
    <meta name="theme-color" content="#050402">
    <title>⬆️ Updates</title>
    <!-- Nov 21 2026 (Craft; approved): app updates wait for you. This page shows what's new, and Update
         makes a safety copy, uploads your save, loads the new files and writes it all to the change log. -->
    <script src="../../core/boot.js" data-load="styles"></script>
    <link rel="stylesheet" href="../settings/settings.css">
    <link rel="stylesheet" href="./app-updates.css">
</head>
<body>
    <main class="stv2 upv">
        <h1 class="settings-title">⬆️ UPDATES</h1>
        <section class="card up-now" id="up-now" aria-live="polite">Checking…</section>
        <section class="card up-new" id="up-new" hidden></section>
        <!-- Nov 24 2026 (Craft): on = a new version loads by itself; off = it waits for the Update button. -->
        <section class="card" id="up-auto-card" hidden>
            <div class="row"><span class="hx">🔄</span><span class="mid"><b>Update by itself</b><small id="up-auto-note">A new version downloads and restarts BizzyBee by itself. A safety copy is made first.</small></span><label class="toggle-switch"><input type="checkbox" id="up-auto" aria-label="Update by itself" checked><span class="toggle-switch-track"><span class="toggle-switch-thumb"></span></span></label></div>
        </section>
        <h2 class="sec">Update history</h2>
        <section class="card"><div id="up-history" class="list"></div></section>
    </main>
    <script src="../../core/boot.js"></script>
    <script src="../../core/services/web-update/web-update.js"></script>
    <script src="./app-updates.js"></script>
</body>
</html>
