<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../../../favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="../../../src/assets/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../../../src/assets/icons/favicon-16x16.png">
    <link rel="apple-touch-icon" href="../../../src/assets/icons/apple-touch-icon.png">
    <link rel="manifest" href="../../../manifest.json">
    <meta name="theme-color" content="#050402">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>📜 Quests</title>

    <link rel="stylesheet" href="../../core/global.css">
    <link rel="stylesheet" href="../../core/hive-mind/hive-mind.css">
    <link rel="stylesheet" href="../../core/hive-mind/nano-bee.css">
    <link rel="stylesheet" href="../../core/toast/toast.css">
    <link rel="stylesheet" href="../llm-engine/llm-engine.css">
    <link rel="stylesheet" href="../../core/habit-row/habit-row.css">
    <link rel="stylesheet" href="../../core/task-row/task-row.css">
    <link rel="stylesheet" href="./quest-common.css">
    <link rel="stylesheet" href="./quests.css">
</head>
<body>

    <main class="quests-container">
        <section class="dl-head">
            <h2 class="dl-title">📜 QUESTS <small>Long-term goals</small></h2>
            <p class="q-sum" id="q-sum"></p>
            <div class="q-tabs" role="tablist" aria-label="Show">
                <button type="button" role="tab" data-tab="main" aria-selected="true">Main <b id="q-n-main">0</b></button>
                <button type="button" role="tab" data-tab="side" aria-selected="false">Side <b id="q-n-side">0</b></button>
                <button type="button" role="tab" data-tab="done" aria-selected="false">Done <b id="q-n-done">0</b></button>
            </div>
            <p class="dl-tip">Goals that take more than a day. Break one into tasks, then chip away. Tap 🎯 to focus on one.</p>
        </section>

        <section class="qa" id="q-active"></section>

        <ul class="q-list" id="q-list"></ul>
    </main>

    <script src="../../core/db.js"></script>
    <script src="../../core/plugins.js"></script>
    <script src="../../core/app.js"></script>
    <script src="../../core/hive-mind/nano-bee.js"></script>
    <script src="../../core/hive-mind/hive-mind.js"></script>
    <script src="../../core/toast/toast.js"></script>
    <script src="../../core/reminders/reminders.js"></script>
    <script src="../llm-engine/llm-engine.js"></script>

    <script src="../../core/habit-row/habit-row.js"></script>
    <script src="../../core/task-row/task-row.js"></script>
    <script src="./quest-common.js"></script>
    <script src="./quests.js"></script>
</body>
</html>
