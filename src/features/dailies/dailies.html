<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../../../favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="../../../src/assets/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../../../src/assets/icons/favicon-16x16.png">
    <link rel="apple-touch-icon" href="../../../src/assets/icons/apple-touch-icon.png">
    <link rel="manifest" href="../../../manifest.json">
    <meta name="theme-color" content="#050402">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>☀️ Dailies</title>

    <script src="../../core/boot.js" data-load="styles"></script>
    <link rel="stylesheet" href="../../core/ui/habit-row/habit-row.css">
    <link rel="stylesheet" href="../../core/ui/task-row/task-row.css">
    <link rel="stylesheet" href="./dailies.css">
</head>
<body>

    <main class="dailies-container">
        <section class="dl-head">
            <h2 class="dl-title">☀️ DAILIES <small>Hold a daily to move it</small></h2>
            <div class="dl-today">
                <div class="dl-today-top">
                    <span id="dl-count">0 of 0 done today</span>
                    <span class="dl-date" id="dl-date"></span>
                </div>
                <div class="dl-bar" role="progressbar" aria-label="Done today" aria-valuemin="0" aria-valuemax="100" id="dl-bar"><i id="dl-bar-fill"></i></div>
            </div>
            <p class="dl-tip">Tap the hexagon when it's done. Tap a daily to edit it. They reset every day.</p>
        </section>

        <section id="daily-task-list"></section>
    </main>

    <script src="../../core/boot.js"></script>

    <script src="../../core/ui/habit-row/habit-row.js"></script>
    <script src="../../core/ui/task-row/task-row.js"></script>
    <script src="./dailies.js"></script>
</body>
</html>
