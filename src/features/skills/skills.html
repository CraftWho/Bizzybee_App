<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../../../favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="../../../src/assets/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../../../src/assets/icons/favicon-16x16.png">

    <title>🌿 Skills Mastery</title>

    <link rel="stylesheet" href="../../core/global.css">
    <link rel="stylesheet" href="../../core/hive-mind/hive-mind.css">

<body>

    <main id="skills-root" class="skills-container">
        <div class="panel page-header-panel">
            <h2 class="page-title">🌿 <span class="gold-gradient-text">SKILL TREE</span></h2>
            <p class="page-subtitle">Every branch is a real skill - click a node to inspect it, unlock the next one once its root is mastered.</p>
        </div>

        <section id="skill-tree" class="panel">
            <div class="tree" id="skill-tree-tree"></div>
        </section>

        <section id="skill-info" class="panel">
            <h3>🧠 Skill Data</h3>
            <p id="skill-description">Select a node to analyze data.</p>
            <div id="skill-action"></div>
        </section>
    </main>

    <script src="../../core/plugins.js"></script>
