<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../../../favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="../../../src/assets/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../../../src/assets/icons/favicon-16x16.png">
    <link rel="apple-touch-icon" href="../../../src/assets/icons/apple-touch-icon.png">
    <link rel="manifest" href="../../../manifest.json">
    <meta name="theme-color" content="#050402">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>🌿 Skills</title>

    <script src="../../core/boot.js" data-load="styles"></script>
    <link rel="stylesheet" href="./skills.css">
</head>
<body>

    <main id="skills-root" class="sk-page">
        <section class="sk-card sk-top">
            <div class="sk-head"><h1>🌿 SKILLS</h1><div class="sk-meta"><b id="sk-count"></b>skills</div></div>
            <p class="sk-sub">Each cell is a skill. Tap one for its time, XP and path of milestones. A red dot means a reward is waiting.</p>
        </section>

        <h2 class="sk-sec">Your skills</h2>
        <section class="sk-honey" id="sk-mastery"></section>
        <p class="sk-from">Tap a cell for details. Skills grow from every Daily, Habit, To-Do and Quest task you finish. About 1 XP = 1 minute.</p>

    </main>

    <div class="sk-sheet-bg" id="sk-sheet" hidden><div class="sk-sheet" id="sk-sheet-body" role="dialog" aria-modal="true"></div></div>

    <script src="../../core/boot.js"></script>

    <script src="./skills.js"></script>
</body>
</html>
