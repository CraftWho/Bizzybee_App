<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../../../favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="../../../src/assets/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../../../src/assets/icons/favicon-16x16.png">
    <link rel="apple-touch-icon" href="../../../src/assets/icons/apple-touch-icon.png">
    <link rel="manifest" href="../../../manifest.json">
    <meta name="theme-color" content="#050402">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>🍯 Honey Mart</title>

    <script src="../../core/boot.js" data-load="styles"></script>
    <link rel="stylesheet" href="../../core/ui/item-card/item-card.css">
    <link rel="stylesheet" href="../../core/ui/modal/modal.css">
    <link rel="stylesheet" href="../../core/ui/page-v2/page-v2.css">
    <link rel="stylesheet" href="./honey-store.css">
</head>
<body>

    <!-- Honey Mart (Nov 1 2026, Craft; approved demo): a game-shop feel. The
         clerk talks, you pick BUY / SELL / QUIT, flip pockets with ◀ ▶, pick
         from a list with prices on the right, and set how many with ▲ ▼. -->
    <main class="pv2 hs2 hm">
        <div class="hm-shop" id="hm-shop">
            <div class="hm-top"><b>🍯 HONEY MART</b><div class="hm-money" id="hm-money"></div></div>
            <div class="hm-say" id="hm-say" aria-live="polite"></div>
            <div class="hm-menu" id="hm-menu" role="group" aria-label="Shop">
                <button type="button" class="hm-mbtn" data-m="buy" aria-pressed="true">BUY</button>
                <button type="button" class="hm-mbtn" data-m="sell" aria-pressed="false">SELL</button>
                <button type="button" class="hm-mbtn" data-m="quit" aria-pressed="false">QUIT</button>
            </div>
            <div id="hm-body"></div>
        </div>
        <section class="card hs-links">
            <a class="row" href="../inventory/inventory.html"><span class="hx">🎒</span><span class="mid"><b>Inventory</b><small>Everything you own</small></span><span class="chev">›</span></a>
            <a class="row" href="../mailbox/mailbox.html"><span class="hx">📬</span><span class="mid"><b>Mailbox</b><small>Gifts from friends arrive here</small></span><span class="chev">›</span></a>
        </section>
    </main>

    <script src="../../core/boot.js"></script>
    <script src="../../core/ui/item-card/item-card.js"></script>

    <script src="../../core/ui/page-v2/page-v2.js"></script>
    <script src="../../plugins/incubator/incubator-art.js"></script>
    <script src="./honey-store.js"></script>
</body>
</html>
