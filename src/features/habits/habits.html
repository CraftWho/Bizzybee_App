<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../../../favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="../../../src/assets/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../../../src/assets/icons/favicon-16x16.png">
    <link rel="apple-touch-icon" href="../../../src/assets/icons/apple-touch-icon.png">
    <link rel="manifest" href="../../../manifest.json">
    <meta name="theme-color" content="#050402">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>✅ Habits</title>

    <script src="../../core/boot.js" data-load="styles"></script>
    <link rel="stylesheet" href="../../core/ui/status-dot/status-dot.css">
    <link rel="stylesheet" href="../../core/ui/habit-row/habit-row.css">
    <link rel="stylesheet" href="./habits.css">
</head>
<body>

    <main class="habits-container">
        <section class="habits-head">
            <h2 class="habits-title">✅ HABITS <small>Hold a habit to move it</small></h2>
            <blockquote class="habits-quote" id="habits-quote">
                <span class="habits-quote-tag">QUOTE OF THE WEEK</span>
                <p id="habits-quote-text"></p>
                <footer id="habits-quote-by"></footer>
            </blockquote>
            <p class="habits-tip">Tap + when you do it, − when you slip. Tap a habit to edit it.</p>
        </section>

        <section id="habits-app">
            <div id="habit-list"></div>
        </section>
    </main>

    <script src="../../core/boot.js"></script>
    <script src="../../core/ui/status-dot/status-dot.js"></script>

    <script src="../../core/ui/habit-quotes/habit-quotes.js"></script>
    <script src="../../core/ui/habit-row/habit-row.js"></script>
    <script src="./habits.js"></script>
</body>
</html>
