<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../../../favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="../../../src/assets/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../../../src/assets/icons/favicon-16x16.png">
    <link rel="apple-touch-icon" href="../../../src/assets/icons/apple-touch-icon.png">
    <link rel="manifest" href="../../../manifest.json">
    <meta name="theme-color" content="#050402">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>🐝 Bizzybee</title>

    <script src="../../core/boot.js" data-load="styles"></script>
    <link rel="stylesheet" href="../../core/ui/modal/modal.css">
    <link rel="stylesheet" href="../../core/ui/level-bar/level-bar.css">
    <link rel="stylesheet" href="../../core/ui/habit-row/habit-row.css">
    <link rel="stylesheet" href="../../core/ui/task-row/task-row.css">
    <link rel="stylesheet" href="../quests/quest-common.css">
    <link rel="stylesheet" href="./home.css">
</head>
<body>

    <main class="home-container">

        <nav class="home-card home-hive home-rise" style="--i:0" id="home-hive" aria-label="Your hive at a glance"></nav>

        <!-- Bees that need help (Hive Life moods, Oct 2026). Hidden when all is well. -->
        <a class="home-card home-help" id="home-help" href="../colony-bees/colony-bees.html?show=help" hidden></a>
        <!-- Oct 30 2026 (Craft): Daily bonus ready (hidden once claimed today) -->
        <div class="home-card home-help home-bonus" id="home-bonus" hidden></div>

        <section class="home-card home-today home-rise" style="--i:1" id="home-today">
            <button type="button" class="home-today-head" id="home-today-toggle" aria-expanded="false" aria-controls="home-today-body">
                <svg class="home-ring" viewBox="0 0 46 46" aria-hidden="true">
                    <defs><linearGradient id="homeRingG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0a0"/><stop offset="1" stop-color="#e8a317"/></linearGradient></defs>
                    <circle class="home-ring-bg" cx="23" cy="23" r="19"/>
                    <circle class="home-ring-fg" id="home-ring-fg" cx="23" cy="23" r="19" stroke-dasharray="119.4" stroke-dashoffset="119.4"/>
                    <text x="23" y="27" text-anchor="middle" id="home-ring-text">0</text>
                </svg>
                <span class="home-today-title"><b>TODAY</b><small id="home-today-sub"></small></span>
                <span class="home-chev" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M5 8 L10 13 L15 8"/></svg></span>
            </button>
            <div class="home-today-body" id="home-today-body">
                <div class="home-today-inner">
                    <div class="home-tabs" role="tablist" id="home-tabs">
                        <span class="home-tab-pill" id="home-tab-pill"></span>
                        <button type="button" class="home-tab" role="tab" data-tab="dailies">Dailies<span class="home-tab-n" data-n="dailies"></span></button>
                        <button type="button" class="home-tab" role="tab" data-tab="habits">Habits</button>
                        <button type="button" class="home-tab" role="tab" data-tab="todos">To-Dos<span class="home-tab-n" data-n="todos"></span></button>
                        <button type="button" class="home-tab" role="tab" data-tab="quest">Quest<span class="home-tab-n" data-n="quest"></span></button>
                    </div>
                    <div class="home-panel" id="home-panel"></div>
                    <div class="home-today-foot"><a href="../dailies/dailies.html" id="home-see-all">Open Dailies →</a></div>
                </div>
            </div>
        </section>

        <section class="home-apps home-rise" style="--i:2" id="home-app-grid" aria-label="Apps"></section>

    </main>

    <script src="../../core/boot.js"></script>
    <script src="../../core/ui/level-bar/level-bar.js"></script>
    <script src="../../core/ui/habit-quotes/habit-quotes.js"></script>
    <script src="../../core/ui/habit-row/habit-row.js"></script>
    <script src="../../core/ui/task-row/task-row.js"></script>
    <script src="../quests/quest-common.js"></script>
    <script src="./home.js"></script>
</body>
</html>
