<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐝 Bizzybee Terminal</title>

    <link rel="stylesheet" href="../../core/global.css">
    <link rel="stylesheet" href="../../core/hive-mind/hive-mind.css">
    <link rel="stylesheet" href="../../core/hive-mind/nano-bee.css">
    <link rel="stylesheet" href="../../core/modal/modal.css">
    <link rel="stylesheet" href="../../core/toast/toast.css">
    <link rel="stylesheet" href="../../core/level-bar/level-bar.css">
    <link rel="stylesheet" href="../llm-engine/llm-engine.css">
    <link rel="stylesheet" href="./home.css">
</head>
<body>

    <main class="home-container">

        <section class="panel home-status-panel">
            <div class="home-status-row">
                <span class="home-status-name" id="home-user-name">—</span>
                <span class="home-status-level">Level <strong id="home-user-level">—</strong></span>
            </div>
            <div class="home-level-bar-wrap" id="home-level-bar"></div>
        </section>

        <section class="panel home-collapsible home-collapsible--collapsed" id="home-active-quest-section">
            <button class="home-section-toggle" aria-expanded="false">
                <span class="home-section-chevron">▾</span>
                <h3>🎯 <span class="gold-gradient-text">ACTIVE QUEST</span></h3>
            </button>
            <div class="home-section-body">
                <div class="home-section-body-inner">
                    <div id="home-active-quest"></div>
                    <a href="../quests/quests.html" class="home-section-link">View All Quests →</a>
                </div>
            </div>
        </section>

        <section class="panel home-collapsible home-collapsible--collapsed" id="home-daily-section">
            <button class="home-section-toggle" aria-expanded="false">
                <span class="home-section-chevron">▾</span>
                <h3>☀️ <span class="gold-gradient-text">DAILY TASKS</span></h3>
            </button>
            <div class="home-section-body">
                <div class="home-section-body-inner">
                    <ul class="task-list" id="home-daily-task-list"></ul>
                    <a href="../dailies/dailies.html" class="home-section-link">View All Dailies →</a>
                </div>
            </div>
        </section>

        <section class="home-app-grid" id="home-app-grid"></section>

    </main>

    <script src="../../core/db.js"></script>
    <script src="../../core/plugins.js"></script>
    <script src="../../core/app.js"></script>
    <script src="../../core/hive-mind/nano-bee.js"></script>
    <script src="../../core/hive-mind/hive-mind.js"></script>
    <script src="../../core/toast/toast.js"></script>
    <script src="../../core/reminders/reminders.js"></script>
    <script src="../../core/level-bar/level-bar.js"></script>
    <script src="../llm-engine/llm-engine.js"></script>

    <script src="./home.js"></script>
</body>
</html>
