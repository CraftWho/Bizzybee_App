    <link rel="icon" type="image/png" sizes="16x16" href="../../../src/assets/icons/favicon-16x16.png">

<body>

    <main class="keeperdex-container">

        <div class="panel page-header-panel">
            <h2 class="page-title">📘 <span class="gold-gradient-text">KEEPERDEX</span></h2>
            <p class="page-subtitle">Every rarity and element the hive can produce, Pokedex-style. Obtain a matching bee to reveal its entry.</p>

        <div class="keeperdex-progress">
            <span class="keeperdex-progress-text" id="keeperdex-progress-text"></span>
            <div class="keeperdex-progress-bar">
                <div class="keeperdex-progress-fill" id="keeperdex-progress-fill"></div>
            </div>
        </div>

        <div class="bee-card-grid" id="keeperdex-grid"></div>

    </main>
