<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../../../favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="../../../src/assets/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../../../src/assets/icons/favicon-16x16.png">
    <link rel="apple-touch-icon" href="../../../src/assets/icons/apple-touch-icon.png">
    <link rel="manifest" href="../../../manifest.json">
    <meta name="theme-color" content="#050402">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>📘 KeeperDex</title>

    <script src="../../core/boot.js" data-load="styles"></script>
    <link rel="stylesheet" href="../../core/ui/bee-card/bee-card.css">
    <link rel="stylesheet" href="../../core/ui/keeperdex-card/keeperdex-card.css">
    <link rel="stylesheet" href="../../core/ui/page-v2/page-v2.css">
    <link rel="stylesheet" href="./keeperdex.css">
</head>
<body>

    <!-- KeeperDex v2 (Oct 2026): same look as Settings/Inventory. Cards are
         shown small in a grid; tap one to see it full size. -->
    <main class="pv2 kd2">
        <header class="pv2-head">
            <h1 class="pv2-title">📘 KEEPERDEX</h1>
            <p class="pv2-lead">Every rarity and element the hive can make. Get a matching bee to reveal its entry.</p>
        </header>

        <section class="card kd-progress">
            <div class="kd-progress-top"><b id="keeperdex-progress-text"></b><small id="keeperdex-progress-pct"></small></div>
            <span class="kd-bar"><i id="keeperdex-progress-fill"></i></span>
        </section>

        <div class="chips" role="group" aria-label="Show" id="kd-tabs"></div>
        <div class="kd-grid" id="keeperdex-grid"></div>

        <!-- Hive Life (Oct 2026): bees that died. -->
        <section id="keeperdex-memorial" hidden>
            <h2 class="sec">In memory</h2>
            <div class="card"><ul class="kd-fallen" id="keeperdex-fallen"></ul></div>
        </section>
    </main>

    <script src="../../core/boot.js"></script>
    <script src="../../core/ui/bee-card/bee-card.js"></script>
    <script src="../../core/ui/keeperdex-card/keeperdex-card.js"></script>

    <script src="../../core/ui/page-v2/page-v2.js"></script>
    <script src="./keeperdex.js"></script>
</body>
</html>
