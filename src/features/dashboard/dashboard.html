<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../../../favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="../../../src/assets/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../../../src/assets/icons/favicon-16x16.png">
    <link rel="apple-touch-icon" href="../../../src/assets/icons/apple-touch-icon.png">
    <link rel="manifest" href="../../../manifest.json">
    <meta name="theme-color" content="#050402">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>👨🏾‍💻 Dashboard</title>
    
    <script src="../../core/boot.js" data-load="styles"></script>
    <link rel="stylesheet" href="../../core/ui/modal/modal.css">
    <link rel="stylesheet" href="../../core/ui/level-bar/level-bar.css">
    <link rel="stylesheet" href="./dashboard.css">
    <link rel="stylesheet" href="../../core/ui/starter-skills/starter-skills.css">
</head>
<body>

    <main class="dbv2">
        <section class="card top">
            <div class="head"><h1>📊 DASHBOARD</h1></div>
            <p class="sub">How your hive is doing: XP, streaks, today's progress and how far each skill is on the road to mastery.</p>
        </section>
        <div class="tiles" id="db-tiles"></div>

        <h2 class="sec">Skill mastery · 10,000 hours <a href="../skills/skills.html">Skills →</a></h2>
        <section class="card" id="db-starter" hidden></section>
        <!-- Nov 7 2026 (Craft): real hours toward 10,000, and check-offs waiting for their minutes -->
        <section class="card db-time-todo" id="time" hidden></section>
        <section class="card db-real" id="db-real"></section>
        <section class="card" id="db-mastery"></section>

        <h2 class="sec">XP · last 14 days</h2>
        <section class="card">
            <div class="chart-head"><b id="db-total"></b><small id="db-avg"></small></div>
            <div class="chart" id="db-chart"></div>
            <details class="sr-table"><summary>Show as a table</summary><table id="db-table"></table></details>
        </section>

        <h2 class="sec">Today</h2>
        <section class="card"><div class="today" id="db-today"></div></section>

        <h2 class="sec">Streaks</h2>
        <section class="card" id="db-streaks"></section>
    </main>

    <script src="../../core/boot.js"></script>

    <script src="../../core/ui/starter-skills/starter-skills.js"></script>
    <script src="./dashboard.js"></script>
</body>
</html>
