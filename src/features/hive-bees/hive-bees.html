<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../../../favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="../../../src/assets/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../../../src/assets/icons/favicon-16x16.png">
    <link rel="apple-touch-icon" href="../../../src/assets/icons/apple-touch-icon.png">
    <link rel="manifest" href="../../../manifest.json">
    <meta name="theme-color" content="#050402">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>🐝 Hive Bees</title>

    <script src="../../core/boot.js" data-load="styles"></script>
    <link rel="stylesheet" href="../../core/ui/bee-card/bee-card.css">
    <link rel="stylesheet" href="../../core/ui/modal/modal.css">
    <link rel="stylesheet" href="../../core/ui/page-v2/page-v2.css">
    <link rel="stylesheet" href="../../core/ui/bee-name/bee-name.css">
    <link rel="stylesheet" href="./hive-bees.css">
</head>
<body>
    <!-- Hive Bees (Oct 2026, approved demo): its own page now (it was a
         pop-up inside Inventory). Same look as Settings (page-v2.css). -->
    <main class="pv2 cb2">
        <header class="pv2-head">
            <h1 class="pv2-title">🐝 HIVE BEES</h1>
            <p class="pv2-lead" id="cb-lead">Tap a bee for its card.</p>
        </header>

        <div class="cb-search">
            <input type="search" id="cb-q" placeholder="Search by name…" aria-label="Search bees">
            <select id="cb-sort" aria-label="Sort">
                <option value="new">Newest</option>
                <option value="old">Oldest</option>
                <option value="rarity">Rarity</option>
                <option value="mood">Mood</option>
                <option value="name">Name</option>
            </select>
        </div>
        <div class="cb-bar">
            <div class="chips" role="group" aria-label="Show" id="cb-tabs"></div>
            <div class="cb-view" role="group" aria-label="View">
                <button type="button" data-view="list" aria-label="List">☰</button>
                <button type="button" data-view="cards" aria-label="Cards">▦</button>
            </div>
        </div>
        <div id="cb-list"></div>
    </main>

    <!-- Tap "Open card": the real, editable bee card (rename, items, evolve). -->
    <div class="cb-expanded" id="cb-expanded" hidden>
        <button type="button" class="cb-expanded-close" aria-label="Close">✕</button>
        <div class="cb-expanded-host"></div>
        <p class="cb-expanded-hint">Tap or swipe the card to flip it.</p>
    </div>

    <script src="../../core/boot.js"></script>
    <script src="../../core/ui/bee-card/bee-card.js"></script>
    <script src="../../core/ui/egg-designs/egg-designs.js"></script>
    <script src="../../core/ui/page-v2/page-v2.js"></script>
    <script src="../../core/ui/bee-name/bee-name.js"></script>

    <script src="./hive-bees.js"></script>
</body>
</html>
