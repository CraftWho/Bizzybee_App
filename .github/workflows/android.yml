# Builds the BizzyBee Android app (native/) on GitHub's servers and posts
# the APK as a GitHub Release. Free for this repo. Runs when the android
# branch changes, or by hand from the Actions tab ("Run workflow").
# Needs two repo secrets: BB_KEYSTORE_B64 and BB_KEYSTORE_PASSWORD.
name: Android APK
on:
  push:
    branches: [android]
    paths: ['native/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # GitHub's Ubuntu runners already include the Android SDK (ANDROID_HOME).
      - run: npm ci
      - run: npx cap sync android
      - name: Build signed APK
        env:
          BB_KEYSTORE_B64: ${{ secrets.BB_KEYSTORE_B64 }}
          BB_KEYSTORE_PASSWORD: ${{ secrets.BB_KEYSTORE_PASSWORD }}
          BB_VERSION_CODE: ${{ github.run_number }}
          BB_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          if [ -z "$BB_KEYSTORE_B64" ]; then echo "Missing BB_KEYSTORE_B64 secret"; exit 1; fi
          echo "$BB_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/bizzybee.jks"
          export BB_KEYSTORE_PATH="$RUNNER_TEMP/bizzybee.jks"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/BizzyBee-1.0.${{ github.run_number }}.apk"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: BizzyBee Android 1.0.${{ github.run_number }}
          body: Install on your phone, or tap Update in the app (Settings › About). Updates install over the old version.
          files: BizzyBee-1.0.${{ github.run_number }}.apk
